name: CI
on:
  push:
    branches: [main, "task/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: gitleaks (blocking; scans the whole repo incl. test fixtures)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway values for build/validate only; no real secrets in CI.
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Dependency audit gate (blocking on high/critical, prod deps)
        run: pnpm audit --prod --audit-level=high
      - name: QA gate (lint, typecheck, test, design tokens + contrast)
        run: pnpm qa
      - name: Backend coverage report (reported, not gated)
        run: pnpm coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            packages/core/coverage
            apps/worker/coverage
            apps/web/coverage
          if-no-files-found: ignore
      - name: Build
        run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: ci
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      # Throwaway values for the CI database, cache and object store only. No real secrets in CI.
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/ci
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ci-minio
      S3_SECRET_ACCESS_KEY: ci-minio-secret
      S3_BUCKET_INGEST: rp-ingest
      S3_BUCKET_PRIVATE: rp-private
      S3_BUCKET_PUBLIC: rp-public
      MODERATION_PROVIDER: mock
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      TOTP_ENC_KEYS: '{"ci1":"Y2ktdG90cC1lbmMta2V5LTAxMjM0NTY3ODlhYmNkZWYhIQ=="}'
      TOTP_ENC_ACTIVE_KEY_ID: ci1
      RECOVERY_CODE_PEPPERS: '{"ci1":"Y2ktcmVjb3ZlcnktcGVwcGVyLTAxMjM0NTY3ODlhYmNkIQ=="}'
      RECOVERY_CODE_ACTIVE_KEY_ID: ci1
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_USER_PASSWORD: ci-user-password
      E2E_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start MinIO and create buckets
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/ready && break; sleep 2; done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set ci http://127.0.0.1:9000 ci-minio ci-minio-secret && mc mb -p ci/rp-ingest ci/rp-private ci/rp-public && mc anonymous set download ci/rp-public"
      - name: Migrate and seed the CI database
        run: pnpm --filter @rp/db migrate:deploy && pnpm --filter @rp/db seed
      - name: Build web app
        run: pnpm build
      - name: Start worker (AI moderation, outbox relay)
        run: nohup pnpm --filter @rp/worker start > worker.log 2>&1 &
      - name: Install Playwright browser
        run: pnpm --filter @rp/web exec playwright install --with-deps chromium
      - name: E2E gate (review flow, chromium)
        run: pnpm --filter @rp/web test:e2e
      - name: E2E quarantine (reported, not gating)
        continue-on-error: true
        run: pnpm --filter @rp/web test:e2e:quarantine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            worker.log
          if-no-files-found: ignore
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose --profile init config -q

  t08-minio:
    # T-08 runtime check: signed content-length, CORS preflight, 24h ingest lifecycle (scripts/t08-minio-check.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose up -d --wait minio && docker compose --profile init run --rm minio-init
      - run: bash scripts/t08-minio-check.sh

  mysql-int:
    # QA-M6-04: the *.int.test.ts suites (MOD-020/021, TMR-014 skew, VOT-003, RPT-004, retention/erasure) plus the real-MySQL
    # schema guarantees (apps/worker/src/mysql-schema.int.test.ts, enabled by RP_INT_MYSQL=1) against a migrated MySQL 8.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: ci
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Throwaway CI values only. The app user needs DDL rights for `migrate deploy` (shadow DB is not used by deploy).
      DATABASE_URL: mysql://root:ci-root-only@127.0.0.1:3306/ci
      RP_INT_MYSQL: "1"
      IP_HASH_KEY: ci-only-ip-hash-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply all migrations to real MySQL
        run: pnpm --filter @rp/db migrate:deploy
      - name: Integration suites (*.int.test.ts) against MySQL
        run: |
          pnpm --filter @rp/core exec vitest run src/retention/rules.int.test.ts
          pnpm --filter @rp/worker exec vitest run int.test
          pnpm --filter @rp/web exec vitest run src/server/m6.int.test.ts

  ops003:
    # OPS-003: the production web build and worker sources must contain no test-only hooks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @rp/web build
      # The worker runs from source via tsx (its `build` is a typecheck, no dist/), so the built artefact to scan is the web output.
      - name: ops003 scan (web .next)
        run: node scripts/ops003-no-test-hooks.mjs apps/web/.next
      - name: ops003 self-check (a planted hook must fail the scan)
        run: |
          mkdir -p /tmp/ops003-bad && echo 'x-test-now' > /tmp/ops003-bad/a.js
          if node scripts/ops003-no-test-hooks.mjs /tmp/ops003-bad; then echo "scan missed a planted hook"; exit 1; fi

  prod-config:
    # Production compose must render, keep the hardening (clamav, redis ACL, egress network, sandbox image) and the worker
    # image must build with bwrap + prlimit and exit 1 without a real MODERATION_PROVIDER.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Render production compose with names-only placeholders
        run: |
          cp .env.production.example .env.prod.ci
          docker compose -f docker-compose.prod.yml --env-file .env.prod.ci --profile init config -q
      - name: Static checks of the production compose
        run: bash scripts/prod-config-check.sh
      - name: Build worker image (bwrap, prlimit, poppler, exiftool)
        run: docker build -f infra/docker/worker.Dockerfile -t rp-worker:ci .
      - name: Worker image has the sandbox prerequisites
        run: docker run --rm --entrypoint sh rp-worker:ci -c 'command -v bwrap && command -v prlimit && command -v pdftoppm && command -v exiftool && command -v ffmpeg'
      - name: Worker refuses to start with MODERATION_PROVIDER unset (fail closed)
        run: |
          set +e
          docker run --rm -e NODE_ENV=production -e IP_HASH_KEY=ci-only-ip-hash-key-0123456789abcdef0123456789 \
            -e DATABASE_URL=mysql://u:p@127.0.0.1:1/x -e REDIS_URL=redis://127.0.0.1:1 -e S3_ENDPOINT=http://127.0.0.1:1 \
            -e S3_ACCESS_KEY_ID=a -e S3_SECRET_ACCESS_KEY=b -e S3_BUCKET_INGEST=i -e S3_BUCKET_PRIVATE=p -e S3_BUCKET_PUBLIC=u \
            rp-worker:ci
          rc=$?; echo "exit=$rc"; [ "$rc" = 1 ]

  staging-smoke:
    # Same smoke as scripts/preview-up.sh step 4, run against a production `next start` of this commit (no deploy).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/ci
      PREVIEW_USE_CWD: "1"
      PREVIEW_PORT: "5101"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: bash scripts/preview-up.sh
      - name: Record smoke evidence
        if: always()
        run: |
          node scripts/preview-smoke.mjs "http://127.0.0.1:5101" | tee smoke-evidence.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-smoke
          path: |
            smoke-evidence.txt
            .preview.log
          if-no-files-found: ignore

  staging-config:
    # LIVE-05: the staging compose renders, passes the static checks, and the preflight fails closed (no docker daemon needed beyond `config`).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.staging.yml --env-file .env.staging.example config -q
      - run: docker compose -f docker-compose.staging.yml --profile tls --env-file .env.staging.example config -q
      - run: bash scripts/staging-config-check.sh
      - name: Preflight refuses mock / unset MODERATION_PROVIDER
        run: |
          for v in "" mock; do
            if env -i PATH="$PATH" ${v:+MODERATION_PROVIDER=$v} STAGING_ENV_FILE=/tmp/none.env bash scripts/staging-up.sh up; then echo "preflight accepted '$v'"; exit 1; fi
          done

  staging-stack:
    # LIVE-05: scripts/staging-up.sh end to end on the runner (MySQL, Redis ACL, MinIO, ClamAV, web, workers, migrate + demo seed, smoke).
    # The moderation key is a throwaway placeholder: the review case still reaches the queue (PENDING); no AI call is expected to succeed.
    # Not gating until it has been green on main (worker-media needs unprivileged user namespaces, which some runners block).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: staging-up.sh
        env:
          MODERATION_PROVIDER: anthropic
          MODERATION_API_KEY: ci-placeholder-not-a-real-key
          STAGING_HOST: 127.0.0.1
        run: bash scripts/staging-up.sh
      - name: Collect evidence and logs
        if: always()
        run: |
          cp .staging-smoke.txt staging-smoke-evidence.txt 2>/dev/null || true
          docker compose -p rp-staging -f docker-compose.staging.yml --env-file .env.staging ps -a > staging-ps.txt 2>&1 || true
          docker compose -p rp-staging -f docker-compose.staging.yml --env-file .env.staging logs --no-color --tail=300 > staging-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-stack
          path: |
            staging-smoke-evidence.txt
            staging-ps.txt
            staging-logs.txt
          if-no-files-found: ignore
