# Local infra only. App processes run on the host via `pnpm dev`. Credentials are throwaway local values.
services:
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root_local_pw
      MYSQL_DATABASE: review_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: app_local_pw
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_local_pw --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction (ADR-0001); AOF for durability.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--aclfile", "/etc/redis/users.acl"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data", "./infra/redis/users.acl:/etc/redis/users.acl:ro"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev/E2E mail sink (ADR-0016). SMTP on 1025, web UI + API on 8025. Nothing is delivered externally.
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio_local
      MINIO_ROOT_PASSWORD: minio_local_secret
      # T-08/SEC-07(3): MinIO OSS has no per-bucket CORS API; CORS is a server-wide setting. App origin only, never "*".
      # Browser PUTs to presigned URLs need only this origin. R2 equivalent: docs/security/ingest-bucket-hardening.md.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3000}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"
    profiles: ["init"]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio_local minio_local_secret &&
      mc mb -p local/rp-ingest local/rp-private local/rp-public &&
      mc anonymous set download local/rp-public &&
      (mc ilm rule ls local/rp-ingest 2>/dev/null | grep -q 'Expiry' || mc ilm rule add --expire-days 1 local/rp-ingest) &&
      echo buckets ready"

  # T-01: isolated verification-egress worker (ADR-0015). Fetches attacker-controlled URLs, so it holds NO DATABASE_URL/S3_*/SMTP_URL:
  # only REDIS_URL (ACL user limited to the verification queues) and VERIFY_DNS_SERVERS. Apply infra/egress/egress-policy.sh on the host.
  # `docker compose --profile egress up -d verification-egress` (needs `pnpm install` done on the host). local-up.sh runs it on the host instead.
  verification-egress:
    image: node:20-bookworm-slim
    profiles: ["egress"]
    working_dir: /app/apps/worker
    volumes: [".:/app:ro"]
    command: ["node_modules/.bin/tsx", "src/main.ts"]
    environment:
      WORKER_GROUPS: verification-egress
      REDIS_URL: redis://verif-egress:egress_local_pw@redis:6379
      VERIFY_DNS_SERVERS: 1.1.1.1,8.8.8.8
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [egress]

networks:
  egress:
    ipam: { config: [{ subnet: 172.28.0.0/24 }] }

volumes:
  mysql-data:
  redis-data:
  minio-data:
