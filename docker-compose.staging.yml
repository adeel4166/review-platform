# Staging topology (LIVE-05): the WHOLE stack on one Docker host, one public URL (web on ${WEB_PORT}).
#   scripts/staging-up.sh            # preflight -> build -> up -> migrate -> seed demo -> smoke   (see docs/ops/staging-runbook.md)
# Reuses the hardened production pieces (Redis ACL rendered from env, MinIO least-privilege users + object-locked rp-ledger /
# rp-audit-archive, worker image with bwrap) and adds MySQL, the web app, a mail sink and the one-shot `migrate` job.
# Every secret is an environment variable NAME; values come from .env.staging (generated by staging-up.sh, gitignored). Compose fails
# fast (`:?`) on a missing variable. NODE_ENV=production for web + workers, so MODERATION_PROVIDER must be real (mock/unset => exit 1).
x-worker: &worker
  image: rp-worker:${RP_IMAGE_TAG:-staging}
  build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=512m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    redis: { condition: service_healthy }

x-web-image: &web-image
  image: rp-web:${RP_IMAGE_TAG:-staging}
  build: { context: ., dockerfile: infra/docker/web.Dockerfile }

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: review_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?}
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' \
          "user default on >$$REDIS_DEFAULT_PASSWORD ~* &* +@all" \
          "user verif-egress on >$$REDIS_VERIF_EGRESS_PASSWORD ~bull:verification-egress:* ~bull:verification-result:* &* +@all -@admin -@dangerous +@scripting +info +client|setname +client|setinfo +client|id" \
          > /tmp/users.acl
        exec redis-server --appendonly yes --maxmemory-policy noeviction --aclfile /tmp/users.acl --protected-mode yes
    environment:
      REDIS_DEFAULT_PASSWORD: ${REDIS_DEFAULT_PASSWORD:?}
      REDIS_VERIF_EGRESS_PASSWORD: ${REDIS_VERIF_EGRESS_PASSWORD:?}
    tmpfs: ["/tmp:size=1m,mode=1777"]
    volumes: ["redis-data:/data"]
    networks: [internal, egress]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user default --pass \"$$REDIS_DEFAULT_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mail sink: nothing leaves the host. UI on loopback only (ssh -L 8025:127.0.0.1:8025 to read verification mails).
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 API is published on ${MINIO_PORT} because browsers PUT presigned uploads and load rp-public media from it. Console stays on loopback.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:?} # app origin only, never "*" (T-08)
    ports: ["${MINIO_PORT:-9000}:9000"]
    volumes: ["minio-data:/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: buckets (incl. object-locked rp-ledger + rp-audit-archive from LIVE-01/SEC-FIN-02), lifecycle, policies, users.
  # Idempotent: re-running after `up` is safe (mb -p, policy create/attach, user add tolerate existing state).
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      RP_CORE_KEY: ${RP_CORE_KEY:?}
      RP_CORE_SECRET: ${RP_CORE_SECRET:?}
      RP_MEDIA_KEY: ${RP_MEDIA_KEY:?}
      RP_MEDIA_SECRET: ${RP_MEDIA_SECRET:?}
      RP_WEB_KEY: ${RP_WEB_KEY:?}
      RP_WEB_SECRET: ${RP_WEB_SECRET:?}
      S3_LEDGER_ACCESS_KEY_ID: ${S3_LEDGER_ACCESS_KEY_ID:?}
      S3_LEDGER_SECRET_ACCESS_KEY: ${S3_LEDGER_SECRET_ACCESS_KEY:?}
      S3_LEDGER_READ_ACCESS_KEY_ID: ${S3_LEDGER_READ_ACCESS_KEY_ID:?}
      S3_LEDGER_READ_SECRET_ACCESS_KEY: ${S3_LEDGER_READ_SECRET_ACCESS_KEY:?}
      S3_AUDIT_ARCHIVE_ACCESS_KEY_ID: ${S3_AUDIT_ARCHIVE_ACCESS_KEY_ID:?}
      S3_AUDIT_ARCHIVE_SECRET_ACCESS_KEY: ${S3_AUDIT_ARCHIVE_SECRET_ACCESS_KEY:?}
      LEDGER_RETENTION_DAYS: ${LEDGER_RETENTION_DAYS:-1}
    volumes: ["./infra/minio/policies:/policies:ro"]
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/rp-ingest local/rp-private local/rp-public
        mc anonymous set none local/rp-ingest; mc anonymous set none local/rp-private; mc anonymous set download local/rp-public
        (mc ilm rule ls local/rp-ingest 2>/dev/null | grep -q Expiry || mc ilm rule add --expire-days 1 local/rp-ingest)
        mc mb -p --with-lock local/rp-ledger local/rp-audit-archive
        mc anonymous set none local/rp-ledger; mc anonymous set none local/rp-audit-archive
        mc retention set --default GOVERNANCE "$${LEDGER_RETENTION_DAYS}d" local/rp-ledger
        mc retention set --default GOVERNANCE "$${LEDGER_RETENTION_DAYS}d" local/rp-audit-archive
        for r in core media web ledger-w ledger-r audit-w; do mc admin policy create local rp-$$r /policies/rp-$$r.json; done
        mc admin user add local "$$RP_CORE_KEY" "$$RP_CORE_SECRET";   mc admin policy attach local rp-core  --user "$$RP_CORE_KEY"  || true
        mc admin user add local "$$RP_MEDIA_KEY" "$$RP_MEDIA_SECRET"; mc admin policy attach local rp-media --user "$$RP_MEDIA_KEY" || true
        mc admin user add local "$$RP_WEB_KEY" "$$RP_WEB_SECRET";     mc admin policy attach local rp-web   --user "$$RP_WEB_KEY"   || true
        mc admin user add local "$$S3_LEDGER_ACCESS_KEY_ID" "$$S3_LEDGER_SECRET_ACCESS_KEY";           mc admin policy attach local rp-ledger-w --user "$$S3_LEDGER_ACCESS_KEY_ID" || true
        mc admin user add local "$$S3_LEDGER_READ_ACCESS_KEY_ID" "$$S3_LEDGER_READ_SECRET_ACCESS_KEY"; mc admin policy attach local rp-ledger-r --user "$$S3_LEDGER_READ_ACCESS_KEY_ID" || true
        mc admin user add local "$$S3_AUDIT_ARCHIVE_ACCESS_KEY_ID" "$$S3_AUDIT_ARCHIVE_SECRET_ACCESS_KEY"; mc admin policy attach local rp-audit-w --user "$$S3_AUDIT_ARCHIVE_ACCESS_KEY_ID" || true
        echo minio ready

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-db:/var/lib/clamav
    networks: [internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      retries: 40
      start_period: 120s

  # One-shot: `prisma migrate deploy`, then (unless STAGING_SEED_DEMO=0) `pnpm db:seed:demo`. NODE_ENV is deliberately NOT production here
  # because the demo seed refuses production; APP_ENV=staging documents the target. The seed is idempotent. DEMO_PASSWORD is never printed.
  migrate:
    <<: *web-image
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      NODE_ENV: development
      APP_ENV: staging
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD:?}@mysql:3306/review_platform
      DEMO_PASSWORD: ${DEMO_PASSWORD:?}
      STAGING_SEED_DEMO: ${STAGING_SEED_DEMO:-1}
    working_dir: /app
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "-c"]
    command:
      - |
        set -e
        pnpm --filter @rp/db migrate:deploy
        if [ "$$STAGING_SEED_DEMO" = 1 ]; then pnpm db:seed:demo; else echo "demo seed skipped (STAGING_SEED_DEMO=0)"; fi
    networks: [internal]

  web:
    <<: *web-image
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["${WEB_PORT:-3000}:3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD:?}@mysql:3306/review_platform
      REDIS_URL: redis://default:${REDIS_DEFAULT_PASSWORD:?}@redis:6379
      # Presigned upload URLs are signed against this endpoint, so it must be reachable from the browser AND from this container
      # (STAGING_HOST = a host name/IP both can resolve; staging-up.sh defaults it to the host's primary IP).
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${RP_WEB_KEY:?}
      S3_SECRET_ACCESS_KEY: ${RP_WEB_SECRET:?}
      S3_BUCKET_INGEST: rp-ingest
      S3_BUCKET_PRIVATE: rp-private
      S3_BUCKET_PUBLIC: rp-public
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?}
      IP_HASH_KEY: ${IP_HASH_KEY:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_TRUST_HOST: "true"
      TOTP_ENC_KEYS: ${TOTP_ENC_KEYS:?}
      TOTP_ENC_ACTIVE_KEY_ID: ${TOTP_ENC_ACTIVE_KEY_ID:?}
      RECOVERY_CODE_PEPPERS: ${RECOVERY_CODE_PEPPERS:?}
      RECOVERY_CODE_ACTIVE_KEY_ID: ${RECOVERY_CODE_ACTIVE_KEY_ID:?}
      MODERATION_PROVIDER: ${MODERATION_PROVIDER:?}
      APP_URL: ${APP_URL:?}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Core group: moderation, outbox, mail, retention/erasure. Holds the AI key. MODERATION_PROVIDER mock/unset => exit 1 (fail closed).
  worker-core:
    <<: *worker
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    environment:
      WORKER_GROUPS: core
      NODE_ENV: production
      MEDIA_SANDBOX_REQUIRED: "true"
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD:?}@mysql:3306/review_platform
      REDIS_URL: redis://default:${REDIS_DEFAULT_PASSWORD:?}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${RP_CORE_KEY:?}
      S3_SECRET_ACCESS_KEY: ${RP_CORE_SECRET:?}
      S3_BUCKET_INGEST: rp-ingest
      S3_BUCKET_PRIVATE: rp-private
      S3_BUCKET_PUBLIC: rp-public
      S3_BUCKET_LEDGER: rp-ledger
      S3_BUCKET_AUDIT_ARCHIVE: rp-audit-archive
      S3_LEDGER_ACCESS_KEY_ID: ${S3_LEDGER_ACCESS_KEY_ID:?}
      S3_LEDGER_SECRET_ACCESS_KEY: ${S3_LEDGER_SECRET_ACCESS_KEY:?}
      S3_LEDGER_READ_ACCESS_KEY_ID: ${S3_LEDGER_READ_ACCESS_KEY_ID:?}
      S3_LEDGER_READ_SECRET_ACCESS_KEY: ${S3_LEDGER_READ_SECRET_ACCESS_KEY:?}
      S3_AUDIT_ARCHIVE_ACCESS_KEY_ID: ${S3_AUDIT_ARCHIVE_ACCESS_KEY_ID:?}
      S3_AUDIT_ARCHIVE_SECRET_ACCESS_KEY: ${S3_AUDIT_ARCHIVE_SECRET_ACCESS_KEY:?}
      ARCHIVE_DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD:?}@mysql:3306/review_platform
      MODERATION_PROVIDER: ${MODERATION_PROVIDER:?}
      MODERATION_API_KEY: ${MODERATION_API_KEY:?}
      MODERATION_MODEL: ${MODERATION_MODEL:-claude-haiku-5-5}
      MODERATION_DAILY_CAP: ${MODERATION_DAILY_CAP:-2000}
      IP_HASH_KEY: ${IP_HASH_KEY:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      TOTP_ENC_KEYS: ${TOTP_ENC_KEYS:?}
      TOTP_ENC_ACTIVE_KEY_ID: ${TOTP_ENC_ACTIVE_KEY_ID:?}
      RECOVERY_CODE_PEPPERS: ${RECOVERY_CODE_PEPPERS:?}
      RECOVERY_CODE_ACTIVE_KEY_ID: ${RECOVERY_CODE_ACTIVE_KEY_ID:?}
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: ${MAIL_FROM:-staging@review-platform.invalid}
      APP_URL: ${APP_URL:?}
    networks: [internal]

  # Media group (untrusted parsers): no AI key, SMTP or auth/2FA secrets (assertMediaEnv). bwrap needs unprivileged user namespaces,
  # which Docker's default seccomp profile blocks; the startup self-test exits 1 if the sandbox cannot be proven, so this fails closed.
  worker-media:
    <<: *worker
    security_opt: ["no-new-privileges:true", "seccomp=unconfined"]
    depends_on:
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      WORKER_GROUPS: media
      NODE_ENV: production
      MEDIA_SANDBOX_REQUIRED: "true"
      MEDIA_EXIFTOOL_REQUIRED: "true"
      DATABASE_URL: mysql://app:${MYSQL_APP_PASSWORD:?}@mysql:3306/review_platform
      REDIS_URL: redis://default:${REDIS_DEFAULT_PASSWORD:?}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${RP_MEDIA_KEY:?}
      S3_SECRET_ACCESS_KEY: ${RP_MEDIA_SECRET:?}
      S3_BUCKET_INGEST: rp-ingest
      S3_BUCKET_PRIVATE: rp-private
      S3_BUCKET_PUBLIC: rp-public
      IP_HASH_KEY: ${IP_HASH_KEY:?}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?}
      WORKER_HEALTH_PORT: "8081"
    networks: [internal]

  # Verification egress: fetches attacker-controlled URLs. Only REDIS_URL (ACL user limited to its queues) + VERIFY_DNS_SERVERS.
  # Apply infra/egress/egress-policy.sh on the host (EGRESS_SUBNET=172.28.0.0/24, APPLY=1 as root) to enforce the network deny-list.
  verification-egress:
    <<: *worker
    environment:
      WORKER_GROUPS: verification-egress
      NODE_ENV: production
      REDIS_URL: redis://verif-egress:${REDIS_VERIF_EGRESS_PASSWORD:?}@redis:6379
      VERIFY_DNS_SERVERS: ${VERIFY_DNS_SERVERS:-1.1.1.1,8.8.8.8}
    networks: [egress]

networks:
  internal: {}
  egress:
    ipam: { config: [{ subnet: 172.28.0.0/24 }] }

volumes:
  clamav-db:
  mysql-data:
  redis-data:
  minio-data:
